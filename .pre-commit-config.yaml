repos:
  # ตรวจช่องว่างท้ายบรรทัด, บรรทัดปิดไฟล์, YAML และขนาดไฟล์
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  # จัดรูปแบบโค้ด C/C++ อัตโนมัติตามไฟล์ .clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]

 # ตรวจรูปแบบหัวข้อ Commit ให้ตรงตาม Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, ci, chore, build]
